name: QuickFix India Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          value="${GOOGLE_SERVICES_JSON_BASE64:-}"

          if [ -z "$value" ]; then
            echo "::error::Firebase secret is missing"
            exit 1
          fi

          mkdir -p android/app

          if [[ "$value" =~ ^[[:space:]]*\{ ]]; then
            printf '%s' "$value" > android/app/google-services.json
          else
            encoded="$(printf '%s' "$value" | tr -d '[:space:]')"
            printf '%s' "$encoded" | base64 --decode > android/app/google-services.json
          fi

          python3 -m json.tool android/app/google-services.json > /dev/null

          python3 - <<'PY'
          import json
          with open("android/app/google-services.json", encoding="utf-8") as f:
              data = json.load(f)
          packages = {
              c.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for c in data.get("client", [])
          }
          if "com.quickfix.app" not in packages:
              raise SystemExit("Wrong Firebase package")
          print("Firebase configuration verified.")
          PY

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quickfix-india-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
