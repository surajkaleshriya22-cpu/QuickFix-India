name: QuickFix India Vite Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# This workflow only reads repository contents and does not need write access.
permissions:
  contents: read

concurrency:
  group: quickfix-vite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.12.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Dependency security audit (fail on high)
        shell: bash
        run: |
          npm audit --omit=dev --audit-level=high --json > "$RUNNER_TEMP/npm-audit.json" || audit_exit=$?
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          console.log("Vulnerability totals:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, vulnerability] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name,
              severity: vulnerability.severity,
              range: vulnerability.range,
              via: vulnerability.via,
              effects: vulnerability.effects,
              nodes: vulnerability.nodes,
              fixAvailable: vulnerability.fixAvailable
            }, null, 2));
          }
          NODE
          npm explain @grpc/grpc-js || true
          exit "${audit_exit:-0}"

      - name: Run regression tests
        run: npm test

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Run authenticated OTP API integration tests on Firebase Emulators
        run: npx --yes firebase-tools@14.22.0 emulators:exec --project quickfix-india --only auth,firestore "npm run test:otp-integration"

      - name: TypeScript check
        run: npm run lint

      - name: Build Vite app
        run: npm run build
