name: QuickFix India Web CI

on:
  push:
    branches: ["main", "test/booking-otp-emulator-harness"]
  pull_request:
    branches: ["main", "secure-booking-otp-workflow"]

permissions:
  contents: read

jobs:
  web-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Booking date and helper regression tests
        run: npm test

      - name: Booking OTP Firebase Emulator integration tests
        run: npx --yes firebase-tools@14 emulators:exec --project demo-quickfix-india --only auth,firestore "npx tsx --test tests/booking-otp.emulator.test.ts"

      - name: Build
        run: npm run build
