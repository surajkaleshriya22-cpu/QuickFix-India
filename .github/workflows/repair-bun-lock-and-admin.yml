name: Repair Bun Lock and Set Admin Claim

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Regenerate lockfile from package.json
        run: bun install

      - name: Verify production build
        run: bun run build

      - name: Commit corrected bun.lock
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "fix: regenerate Bun lockfile"
            git push origin HEAD:main
          else
            echo "bun.lock already matches package.json"
          fi

      - name: Set Firebase admin custom claim when credential is available
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          QUICKFIX_ADMIN_UID: DXUshx5V2agHnQgK41bxByo3ZiC2
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            bun run set-admin-claim
          else
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is not configured; skipping admin claim."
          fi
