      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          value="${GOOGLE_SERVICES_JSON_BASE64:-}"

          if [ -z "$value" ]; then
            echo "::error::Firebase secret is missing"
            exit 1
          fi

          mkdir -p android/app

          if [[ "$value" =~ ^[[:space:]]*\{ ]]; then
            printf '%s' "$value" > android/app/google-services.json
          else
            encoded="$(printf '%s' "$value" | tr -d '[:space:]')"
            printf '%s' "$encoded" | base64 --decode > android/app/google-services.json
          fi

          python3 -m json.tool android/app/google-services.json > /dev/null

          python3 - <<'PY'
          import json
          with open("android/app/google-services.json") as f:
              data = json.load(f)
          packages = {
              c.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for c in data.get("client", [])
          }
          if "com.quickfix.app" not in packages:
              raise SystemExit("Wrong Firebase Android package. Expected com.quickfix.app")
          print("Firebase configuration verified.")
          PY
