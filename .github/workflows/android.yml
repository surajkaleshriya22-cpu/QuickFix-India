name: QuickFix India Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/webpack.yml"
      - "src/lib/firebase.ts"
      - "firebase.json"
      - "firestore.rules"
      - "src/**"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/webpack.yml"
      - "src/lib/firebase.ts"
      - "firebase.json"
      - "firestore.rules"
      - "src/**"

permissions:
  contents: read

jobs:
  apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b
        with:
          gradle-version: "8.9"

      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          value="${GOOGLE_SERVICES_JSON_BASE64:-}"

          if [ -z "$value" ]; then
            echo "::error::Firebase secret is missing"
            exit 1
          fi

          mkdir -p android/app

          if [[ "$value" =~ ^[[:space:]]*\{ ]]; then
            printf '%s' "$value" > android/app/google-services.json
          else
            encoded="$(printf '%s' "$value" | tr -d '[:space:]')"
            printf '%s' "$encoded" | base64 --decode > android/app/google-services.json
          fi

          python3 -m json.tool android/app/google-services.json > /dev/null

          python3 - <<'PY'
          import json
          with open("android/app/google-services.json", encoding="utf-8") as f:
              data = json.load(f)
          project_id = data.get("project_info", {}).get("project_id")
          if project_id != "quickfix-india":
              raise SystemExit(f"Wrong Firebase project: expected quickfix-india, got {project_id!r}")

          expected_app_id = "1:731570128431:android:887008c924cca44e3568da"
          matching_clients = [
              c for c in data.get("client", [])
              if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.quickfix.app"
          ]
          if not matching_clients:
              raise SystemExit("Wrong Firebase Android package: expected com.quickfix.app")

          app_ids = {
              c.get("client_info", {}).get("mobilesdk_app_id")
              for c in matching_clients
          }
          if expected_app_id not in app_ids:
              raise SystemExit("Firebase Android app ID does not match the registered QuickFix India app")

          print("Firebase project, Android package, and Android app ID verified.")
          PY

      # Keep the debug signing identity stable across GitHub-hosted runners.
      # This key is for debug APKs only; never use it for a production release.
      - name: Restore stable debug signing key
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.android/debug.keystore
          key: quickfix-android-debug-keystore-v1

      - name: Create debug signing key when cache is empty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Print APK signing certificate fingerprints
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "::error::Debug APK not found"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quickfix-india-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
