name: QuickFix India Vite Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# This workflow only reads repository contents and does not need write access.
permissions:
  contents: read

concurrency:
  group: quickfix-vite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Dependency security audit (fail on high)
        shell: bash
        run: |
          npm audit --audit-level=high --json > "$RUNNER_TEMP/npm-audit.json" || audit_exit=$?
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          console.log("Vulnerability totals:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, vulnerability] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name,
              severity: vulnerability.severity,
              range: vulnerability.range,
              via: vulnerability.via,
              effects: vulnerability.effects,
              nodes: vulnerability.nodes,
              fixAvailable: vulnerability.fixAvailable
            }, null, 2));
          }
          NODE
          npm explain @grpc/grpc-js || true
          exit "${audit_exit:-0}"

      - name: TypeScript check
        run: npm run lint

      - name: Build Vite app
        run: npm run build
