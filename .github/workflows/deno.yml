name: QuickFix India Web CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  web-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"

      - name: Install dependencies
        run: npm install

      - name: Dependency security audit (report only)
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          console.log("Vulnerability totals:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, vulnerability] of Object.entries(report.vulnerabilities ?? {})) {
            const via = (vulnerability.via ?? []).map(item =>
              typeof item === "string" ? item : `${item.name}: ${item.title} (${item.range})`
            );
            console.log(JSON.stringify({
              name,
              severity: vulnerability.severity,
              range: vulnerability.range,
              via,
              fixAvailable: vulnerability.fixAvailable
            }));
          }
          NODE

      - name: TypeScript check
        run: npm run lint

      - name: Build
        run: npm run build
